<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" fill="none">
  <!-- Rounded tile with ~10% transparent padding around 192x192 canvas -->
  <rect x="16" y="16" width="160" height="160" rx="28" fill="#0B192C" stroke="#4A90E2" stroke-width="3"/>
  <!-- Stacked histogram templates -->
  <rect x="36" y="120" width="22" height="32" fill="#1E3E62" stroke="#4A90E2" stroke-width="2"/>
  <rect x="61" y="96" width="22" height="56" fill="#1E3E62" stroke="#4A90E2" stroke-width="2"/>
  <rect x="86" y="68" width="22" height="84" fill="#1E3E62" stroke="#4A90E2" stroke-width="2"/>
  <rect x="111" y="86" width="22" height="66" fill="#1E3E62" stroke="#4A90E2" stroke-width="2"/>
  <rect x="136" y="110" width="22" height="42" fill="#1E3E62" stroke="#4A90E2" stroke-width="2"/>
  <!-- Signal overlay on top of background -->
  <rect x="86" y="50" width="22" height="18" fill="#FF6500" opacity="0.9"/>
  <rect x="111" y="72" width="22" height="14" fill="#FF6500" opacity="0.9"/>
  <rect x="136" y="100" width="22" height="10" fill="#FF6500" opacity="0.9"/>
  <!-- Profile likelihood curve (-2 Delta ln L) -->
  <path d="M 40 46 Q 97 156 154 46" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Data points with error bars -->
  <line x1="47" y1="112" x2="47" y2="126" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="47" cy="119" r="3.5" fill="#FFFFFF"/>
  <line x1="72" y1="88" x2="72" y2="102" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="72" cy="95" r="3.5" fill="#FFFFFF"/>
  <line x1="97" y1="42" x2="97" y2="58" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="97" cy="50" r="3.5" fill="#FFFFFF"/>
  <line x1="122" y1="64" x2="122" y2="80" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="122" cy="72" r="3.5" fill="#FFFFFF"/>
  <line x1="147" y1="92" x2="147" y2="108" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="147" cy="100" r="3.5" fill="#FFFFFF"/>
  <!-- Axes -->
  <line x1="30" y1="152" x2="164" y2="152" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
